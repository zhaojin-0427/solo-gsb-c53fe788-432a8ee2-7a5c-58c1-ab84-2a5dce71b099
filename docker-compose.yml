services:
  registry:
    build: .
    image: local-oci-registry
    ports:
      - "5000:8000"
    volumes:
      - registry-data:/data
    environment:
      # 上传会话租约（秒）：超时无读写会被 GC 回收
      REGISTRY_UPLOAD_LEASE_SECONDS: "3600"
      # GC 宽限期（秒）：保护“已上传、尚未被 manifest 引用”的新 blob
      REGISTRY_GC_GRACE_SECONDS: "3600"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  registry-data:
